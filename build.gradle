plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/ntgl.classtweaker")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // GeckoLib 5 for Fabric 26.2 (and any jars nested in it), downloaded by CI into libs/
    compileOnly fileTree(dir: "libs", include: ["*.jar", "nested/*.jar"])

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // lets the development runs (and the CI smoke test) load GeckoLib; not bundled into the jar
    runtimeOnly fileTree(dir: "libs", include: ["*.jar"])
}

// Client game test used by the CI smoke test (src/gametest, not part of the released jar)
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "ntgl_smoketest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
        // CI drops a gun pack into the run directory before the test starts
        clearRunDirectory = false
    }
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE.txt")
}

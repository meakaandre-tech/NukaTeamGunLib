name: Build

on:
  push:
    branches: ["fabric-26.2"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Download libraries
        shell: bash
        run: |
          mkdir -p libs/nested
          curl -fsSL -o libs/geckolib-fabric-26.2-5.5.3.jar https://cdn.modrinth.com/data/8BmcQJ2H/versions/L6bn4TS8/geckolib-fabric-26.2-5.5.3.jar
          # jars nested inside the libraries are needed on the compile classpath too
          for j in libs/*.jar; do unzip -o -j -q "$j" 'META-INF/jars/*.jar' -d libs/nested 2>/dev/null || true; done
          ls -lR libs
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          cat > /tmp/maxerrs.gradle <<'GRADLE'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              options.compilerArgs += ["-Xmaxerrs", "20000", "-Xmaxwarns", "0"]
            }
          }
          GRADLE
          ./gradlew build --no-daemon --continue -Dorg.gradle.console=plain -I /tmp/maxerrs.gradle 2>&1 | tee build.log
      - name: Smoke test (dedicated server start + client game test with screenshots)
        if: success() && hashFiles('.github/smoke-test') != ''
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          mkdir -p /tmp/ci/smoke/screenshots
          sudo apt-get update -qq > /dev/null 2>&1 || true
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null 2>&1 || true
          # --- dedicated server: must reach "Done" without loading client classes
          mkdir -p run && echo "eula=true" > run/eula.txt
          (./gradlew runServer --no-daemon -Dorg.gradle.console=plain --args="nogui" > /tmp/ci/smoke/server-gradle.log 2>&1 &)
          for i in $(seq 1 200); do
            grep -q 'Done (' /tmp/ci/smoke/server-gradle.log && break
            grep -qE 'BUILD FAILED|BUILD SUCCESSFUL|Crash report' /tmp/ci/smoke/server-gradle.log && break
            sleep 3
          done
          sleep 15
          pkill -f devlaunchinjector || true
          sleep 5
          pkill -f 'runServer' || true
          cp run/logs/latest.log /tmp/ci/smoke/server-latest.log 2>/dev/null || true
          cp -r run/crash-reports /tmp/ci/smoke/server-crash-reports 2>/dev/null || true
          # --- a gun pack in the pre-26 layout (geo/, animations/, builtin/entity item model, no pack.mcmeta)
          pack=/tmp/legacy_pack; res=src/main/resources
          mkdir -p $pack/assets/legacytest/geo/weapons $pack/assets/legacytest/animations/weapons $pack/assets/legacytest/textures/weapons/testgun $pack/assets/legacytest/models/item $pack/data/legacytest/weapons/guns
          cp $res/assets/ntgl/geckolib/models/weapons/pistol10mm.geo.json $pack/assets/legacytest/geo/weapons/testgun.geo.json
          cp $res/assets/ntgl/geckolib/animations/weapons/pistol10mm.animation.json $pack/assets/legacytest/animations/weapons/testgun.animation.json
          cp $res/assets/ntgl/textures/weapons/pistol10mm/pistol10mm.png $pack/assets/legacytest/textures/weapons/testgun/testgun.png
          sed '0,/{/s//{ "parent": "builtin\/entity",/' $res/assets/ntgl/models/item/pistol10mm.json > $pack/assets/legacytest/models/item/testgun.json
          cp $res/data/ntgl/weapons/guns/pistol10mm.json $pack/data/legacytest/weapons/guns/testgun.json
          echo '{"weapons":["legacytest:testgun"],"attachments":[],"ammo":[]}' > $pack/registry.json
          mkdir -p build/run/clientGameTest/ntgl
          (cd $pack && zip -q -r "$GITHUB_WORKSPACE/build/run/clientGameTest/ntgl/legacy_test.zip" .) || true
          # --- client: fabric client game test under a virtual display
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --no-daemon -Dorg.gradle.console=plain > /tmp/ci/smoke/client-gradle.log 2>&1 || true
          d=build/run/clientGameTest
          cp $d/logs/latest.log /tmp/ci/smoke/client-latest.log 2>/dev/null || true
          cp -r $d/crash-reports /tmp/ci/smoke/client-crash-reports 2>/dev/null || true
          cp $d/screenshots/*.png /tmp/ci/smoke/screenshots/ 2>/dev/null || true
          (ls -lR $d 2>&1 | head -300) > /tmp/ci/smoke/client-run-dir.txt || true
      - name: Dump game signatures
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci
          if [ -f .github/dump-signatures ]; then
            jars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources || true)
            jars="$jars $(find ~/.gradle/caches/modules-2 -name 'fabric-*.jar' 2>/dev/null | grep -v sources | tr '\n' ' ')"
            cp=$(echo $jars | tr ' ' ':')
            for j in $jars; do unzip -Z1 "$j" | grep '\.class$' ; done | sed 's/\.class$//' | sort -u > /tmp/ci/classes.txt || true
            sed 's#/#.#g' /tmp/ci/classes.txt | grep -v 'package-info\|module-info' > /tmp/all-classes.txt
            (xargs -a /tmp/all-classes.txt -n 300 javap -p -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/ci/javap-all.txt.gz
          fi
          if [ -f .github/dump-bytecode ]; then
            jars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources || true)
            jars="$jars $(find ~/.gradle/caches/modules-2 -name 'fabric-*.jar' 2>/dev/null | grep -v sources | tr '\n' ' ')"
            cp=$(echo $jars | tr ' ' ':')
            cp="$cp:$(find libs -name '*.jar' | tr '\n' ':')"
            (xargs -a .github/dump-bytecode javap -p -c -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/ci/bytecode.txt.gz
          fi
      - name: Dump library signatures
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci
          if [ -f .github/dump-libs ]; then
            ls -lR libs > /tmp/ci/libs.txt 2>&1 || true
            jars=$(find libs -name '*.jar' | tr '\n' ' ')
            mcjars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources | tr '\n' ' ' || true)
            cp=$(echo $jars $mcjars | tr ' ' ':')
            for j in $jars; do unzip -Z1 "$j" | grep '\.class$' ; done | sed 's/\.class$//' | sed 's#/#.#g' | grep -v 'package-info\|module-info' | sort -u > /tmp/lib-classes.txt || true
            (xargs -a /tmp/lib-classes.txt -n 300 javap -p -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/ci/javap-libs.txt.gz
            mkdir -p /tmp/libres
            for j in $jars; do unzip -o -q "$j" '*.json' 'META-INF/*' -x 'META-INF/jars/*' -d /tmp/libres/$(basename $j .jar) 2>/dev/null || true; done
            (cd /tmp/libres && tar czf /tmp/ci/libres.tar.gz . ) || true
          fi
      - name: Dump game data files
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci
          if [ -f .github/dump-data ]; then
            mkdir -p /tmp/ci-data
            jars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources || true)
            jars="$jars $(find ~/.gradle/caches/modules-2 -name 'fabric-*.jar' 2>/dev/null | grep -v sources | tr '\n' ' ')"
            for j in $jars; do
              while read -r pattern; do
                [ -z "$pattern" ] && continue
                unzip -o -q "$j" "$pattern" -d /tmp/ci-data 2>/dev/null || true
              done < .github/dump-data
            done
            (cd /tmp/ci-data && tar czf /tmp/ci/data.tar.gz . ) || true
          fi
      - name: Publish build log to the ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cp build.log /tmp/ci/build.log || echo "no log" > /tmp/ci/build.log
          sed -i "s#${GITHUB_WORKSPACE}/##g" /tmp/ci/build.log
          ls -l build/libs > /tmp/ci/jars.txt 2>&1 || true
          echo "${GITHUB_SHA}" > /tmp/ci/commit.txt
          cd /tmp/ci
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ntgl-fabric-26.2
          path: build/libs/*.jar
      - name: Publish the jar as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete fabric-26.2-latest -y --cleanup-tag -R "${{ github.repository }}" || true
          sleep 3
          jar=$(ls build/libs/*.jar | grep -v sources | head -1)
          cp "$jar" ntgl-fabric-26.2.jar
          gh release create fabric-26.2-latest ntgl-fabric-26.2.jar -R "${{ github.repository }}" --target "${GITHUB_SHA}" --title "NTGL for Fabric 26.2 (pack build)" --notes "Built from the fabric-26.2 branch at ${GITHUB_SHA}. Needs GeckoLib 5.5.3 and Fabric API."
